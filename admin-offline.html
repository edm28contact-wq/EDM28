<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#111827">
  <title>EDM28 Gestion · Hors connexion</title>
  <style>
    :root{font-family:Inter,system-ui,Arial,sans-serif;color:#111827;background:#f4f6fa}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px}
    main{width:min(520px,100%);background:#fff;border:1px solid #e4e7ec;border-radius:22px;padding:26px;box-shadow:0 20px 55px #10182818}
    h1{margin:0 0 12px}
    p{color:#667085;line-height:1.55}
    button{border:0;border-radius:12px;padding:12px 16px;font:inherit;font-weight:800;background:#155eef;color:#fff;cursor:pointer}
  </style>
</head>
<body>
  <main>
    <h1>Connexion requise</h1>
    <p>Le back-office EDM28 ne conserve aucune donnée métier hors ligne. Reconnectez cet appareil à Internet, puis rechargez l’application.</p>
    <button type="button" onclick="location.reload()">Réessayer</button>
  </main>
</body>
</html>
