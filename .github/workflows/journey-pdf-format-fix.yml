name: Normalize Reviewed Order PDF Text
on:
  push:
    branches: [feat/client-journey-48h]
    paths: [.github/workflows/journey-pdf-format-fix.yml]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          p=Path('admin-order-personalized-pdf.js');s=p.read_text()
          assert hashlib.sha256(p.read_bytes()).hexdigest()=='f938cf0ef4596c0908b8f39cfbe29f2d2a7ff96a5c2928f46e6aabefbe2f8e8c'
          old="const money = (value) => Number(value || 0).toLocaleString('fr-FR', { style: 'currency', currency: 'EUR' });"
          new="const money = (value) => clean(Number(value || 0).toLocaleString('fr-FR', { style: 'currency', currency: 'EUR' }));"
          assert s.count(old)==1;s=s.replace(old,new)
          old="`Statut OR : ${clean(row.status || 'ready')}`"
          new="`Travaux : ${{draft:'\u00c0 pr\u00e9parer',ready:'Pr\u00e9vus au rendez-vous',signed:'Accept\u00e9s',in_progress:'En cours',completed:'Termin\u00e9s',invoiced:'Termin\u00e9s',cancelled:'Annul\u00e9s'}[row.status] || '\u00c0 pr\u00e9parer'}`"
          assert s.count(old)==1;s=s.replace(old,new);p.write_text(s)
          PY
          node --check admin-order-personalized-pdf.js
          git diff --check
          git add admin-order-personalized-pdf.js
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: keep large PDF amounts legible and translate order progress'
          git push origin HEAD:refs/heads/feat/client-journey-48h
