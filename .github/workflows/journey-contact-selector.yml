name: Align Contact Browser Selector
on:
  push:
    branches: [feat/client-journey-48h]
    paths: [.github/workflows/journey-contact-selector.yml]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          p=Path('tests/journey-browser.mjs');s=p.read_text()
          assert hashlib.sha256(p.read_bytes()).hexdigest()=='7217d30c60138d6e4362ad651e1bf473a05d994be5bcfce9d3f1b819f7a66ec9'
          assert s.count('.contact-panel ')==2
          assert 'class="contact-card"' in Path('public-seo.js').read_text()
          p.write_text(s.replace('.contact-panel ','.contact-card '))
          PY
          git diff --check
          git add tests/journey-browser.mjs
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'test: check email and directions inside the rendered contact card'
          git push origin HEAD:refs/heads/feat/client-journey-48h
