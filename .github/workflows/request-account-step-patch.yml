name: Request Account Step Patch
on:
  push:
    branches: [fix/request-account-step]
    paths: [.github/workflows/request-account-step-patch.yml]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/request-account-step
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Apply reviewed substitutions with before and after checksums
        run: |
          python3 - <<'PY'
          import base64, gzip, hashlib, json
          from pathlib import Path
          payload = ''
          raw = gzip.decompress(base64.b64decode(payload))
          assert hashlib.sha256(raw).hexdigest() == 'b506d27457327fe70b6ce7c08ca8988469701ecf4feb8dadf8b506573c44f0d3'
          edits = json.loads(raw)
          assert set(edits) == {'public-client.js','public-seo.js','tests/journey.test.mjs','tests/journey-browser.mjs'}
          for name, edit in edits.items():
              path = Path(name)
              assert hashlib.sha256(path.read_bytes()).hexdigest() == edit['before'], name
              text = path.read_text()
              for old, new in edit['replacements']:
                  assert text.count(old) == 1, name
                  text = text.replace(old, new)
              assert hashlib.sha256(text.encode()).hexdigest() == edit['after'], name
              path.write_text(text)
              print(name, edit['after'])
          PY
      - name: Validate exact patched application
        run: |
          git diff --check
          npm test
      - name: Commit only reviewed files and remove this temporary workflow
        run: |
          git config user.name 'edm28contact-wq'
          git config user.email 'edm28.contact@gmail.com'
          rm .github/workflows/request-account-step-patch.yml
          git add public-client.js public-seo.js tests/journey.test.mjs tests/journey-browser.mjs .github/workflows/request-account-step-patch.yml
          git commit -m 'fix: keep signup after vehicle and prestation only for guests'
          git push origin HEAD:fix/request-account-step
