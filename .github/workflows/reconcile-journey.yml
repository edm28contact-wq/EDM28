name: Reconcile Journey Schema
on:
  push:
    branches: [feat/client-journey-48h]
    paths: [.github/workflows/reconcile-journey.yml]
permissions:
  contents: read
jobs:
  validate:
    strategy:
      matrix:
        baseline: [reviewed, preactivation]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: isolated-test-only
          POSTGRES_DB: journey_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: isolated-test-only
      PGDATABASE: journey_test
      BASELINE: ${{ matrix.baseline }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Generate and validate migration, twice, without hosted data
        run: |
          python3 .github/scripts/reconcile-journey.py
          psql -v ON_ERROR_STOP=1 -f tests/supplier-basket-fixture.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20260929153243_supplier_basket_quote_flow.sql
          psql -v ON_ERROR_STOP=1 -f tests/journey-fixture.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20260929210843_client_journey_reservations.sql
          if [ "$BASELINE" = preactivation ]; then
            psql -v ON_ERROR_STOP=1 <<'SQL'
          alter table public.journey_email_deliveries rename column dispatch_hash to capability_hash;
          alter table public.journey_email_deliveries rename column available_at to next_attempt_at;
          alter table public.journey_email_deliveries rename column last_error to error_code;
          alter table public.journey_email_deliveries add column first_dispatched_at timestamptz;
          grant select(sent_at,provider_message_id),update(sent_at) on public.journey_email_deliveries to anon;
          alter table public.booking_reservations alter constraint booking_reservations_appointment_id_fkey deferrable initially deferred;
          create function private.admin_prepare_reservation(uuid) returns uuid language sql as $$ select null::uuid $$;
          create function private.admin_confirm_reservation(uuid,text) returns void language plpgsql as $$ begin return; end $$;
          create function private.admin_reject_reservation(uuid,text) returns void language plpgsql as $$ begin return; end $$;
          SQL
          fi
          psql -v ON_ERROR_STOP=1 -1 -f supabase/migrations/20260929222543_journey_schema_reconciliation.sql
          psql -v ON_ERROR_STOP=1 -1 -f supabase/migrations/20260929222543_journey_schema_reconciliation.sql
          psql -v ON_ERROR_STOP=1 -f tests/journey-db.sql
  commit:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 4
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/client-journey-48h
      - name: Commit only the verified reconciliation and remove temporary helpers
        run: |
          python3 .github/scripts/reconcile-journey.py
          git config user.name 'EDM28 validation'
          git config user.email 'edm28.contact@gmail.com'
          git add supabase/migrations/20260929222543_journey_schema_reconciliation.sql
          git rm .github/scripts/reconcile-journey.py .github/workflows/reconcile-journey.yml .github/workflows/journey-final-source.yml
          git commit -m 'fix: align pre-activation journey schema with the reviewed contract'
          git push origin HEAD:feat/client-journey-48h
