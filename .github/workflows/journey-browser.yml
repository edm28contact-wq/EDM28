name: Client Journey Browser
on:
  push:
    branches: [feat/client-journey-48h]
  pull_request:
    branches: [pwa-edm28]
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      RECOVERY_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      RECOVERY_ORIGIN: http://127.0.0.1:4180
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install isolated browser tools
        run: |
          npm install --prefix "$RUNNER_TEMP/journey-tools" --ignore-scripts --no-audit --no-fund playwright@1.58.2
          "$RUNNER_TEMP/journey-tools/node_modules/.bin/playwright" install --with-deps chromium
      - name: Start real handlers with isolated data
        run: |
          node tests/recovery-test-server.mjs > /tmp/journey-server.log 2>&1 &
          for attempt in $(seq 1 30); do
            curl -fsS http://127.0.0.1:4180/admin > /dev/null && exit 0
            sleep 1
          done
          cat /tmp/journey-server.log
          exit 1
      - name: Verify customer journey and preserve password recovery
        run: |
          cp tests/journey-browser.mjs "$RUNNER_TEMP/journey-tools/journey.mjs"
          node "$RUNNER_TEMP/journey-tools/journey.mjs"
          cp tests/recovery-live-check.mjs "$RUNNER_TEMP/journey-tools/recovery.mjs"
          node "$RUNNER_TEMP/journey-tools/recovery.mjs"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: journey-browser-${{ github.run_id }}
          path: |
            journey-browser-artifacts
            recovery-browser-artifacts
          retention-days: 5
