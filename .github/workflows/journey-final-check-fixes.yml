name: Apply Final Journey Test Fixes
on:
  push:
    branches: [feat/client-journey-48h]
    paths: [.github/workflows/journey-final-check-fixes.yml]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Apply guarded edits without weakening capability or ownership checks
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          checks={
          'supabase/migrations/20260929210843_client_journey_reservations.sql':('e6a858ad765ed7b1beb538c1634ef3c181bfd77678ce966a4b22323fbe308f8f','5f7868061b9151a57199d50c695c0ea09c12cb79463706c4496683cc5d5e2d1c'),
          'tests/journey-db.sql':('e2d26c2a620bdb37c1928a568b0fdfef157239daae2296ecc60d97adb9ced475','27b50031d999139602be04de761b2edf0c3c4288de4f8cf6a531faa9b108c512'),
          'tests/journey-browser.mjs':('71166a5636e6de68c300248e77917ac4e2a4be4661904b54646e7e884f649bba','7217d30c60138d6e4362ad651e1bf473a05d994be5bcfce9d3f1b819f7a66ec9')}
          for path,(before,after) in checks.items():
              assert hashlib.sha256(Path(path).read_bytes()).hexdigest()==before,path
          def edit(path,old,new):
              p=Path(path);s=p.read_text();assert s.count(old)==1,(path,old);p.write_text(s.replace(old,new))
          edit('supabase/migrations/20260929210843_client_journey_reservations.sql',"create policy delivery_capability_read on public.journey_email_deliveries for select to anon using(\n lease_until>now() and status in ('dispatching','sending') and","create policy delivery_capability_read on public.journey_email_deliveries for select to anon using(\n lease_until>now() and status in ('dispatching','sending','sent','pending','failed') and")
          edit('tests/journey-db.sql',"select public.fixture_assert((select count(id)=0 from public.journey_email_deliveries),'capability cannot replay sent delivery');\nreset role;","select public.fixture_assert((select count(id)=1 and bool_and(status='sent') from public.journey_email_deliveries),'acknowledgement remains readable only during its lease');\nwith replay as (update public.journey_email_deliveries set status='sending' where status='sent' returning id)\n select public.fixture_assert((select count(*)=0 from replay),'capability cannot replay sent delivery');\nreset role;\nupdate public.journey_email_deliveries set lease_until=now()-interval '1 second' where kind='confirmed';\nset role anon;\nselect public.fixture_assert((select count(id)=0 from public.journey_email_deliveries),'expired capability cannot read acknowledged delivery');\nreset role;")
          edit('tests/journey-browser.mjs',"assert.equal(await page.locator('.intervention-archive [data-file]').count(),2);","assert.equal(await page.locator('.intervention-archive [data-file]').count(),3);")
          for path,(before,after) in checks.items():
              assert hashlib.sha256(Path(path).read_bytes()).hexdigest()==after,path
          p=Path('tests/journey-pdf.cjs');raw=p.read_bytes()
          assert hashlib.sha1(b'blob '+str(len(raw)).encode()+b'\0'+raw).hexdigest()=='c00578b854bd7804b89180e4b1a8d6be5a4bbaa1'
          edit(str(p),"quote_id: '44444444-4444-4444-8444-444444444444', order_number:","vehicle_id: '55555555-5555-4555-8555-555555555555', appointment_id: '66666666-6666-4666-8666-666666666666',\n      quote_id: '44444444-4444-4444-8444-444444444444', order_number:")
          edit(str(p),"const result = { data: table === 'repair_orders' ? row : [], error: null };","const fixture = { repair_orders: row, profiles: row.profiles, vehicles: row.vehicles, appointments: row.appointments, quotes: row.quotes, quote_items: row.quotes.quote_items, inspection_reports: {}, business_configuration: app.businessConfiguration };\n        assert.ok(Object.hasOwn(fixture, table), 'Unexpected PDF query: ' + table);\n        const result = { data: fixture[table], error: null };")
          edit(str(p),"maybeSingle() { return Promise.resolve(result); },","maybeSingle() { return Promise.resolve(result); }, single() { return Promise.resolve(result); },")
          PY
          npm test
          git diff --check
          git add supabase/migrations/20260929210843_client_journey_reservations.sql tests/journey-db.sql tests/journey-browser.mjs tests/journey-pdf.cjs
      - name: Commit to unchanged feature branch only
        env:
          EXPECTED_HEAD: ${{ github.sha }}
        run: |
          test "$(git ls-remote origin refs/heads/feat/client-journey-48h | cut -f1)" = "$EXPECTED_HEAD"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: acknowledge scoped email deliveries and preserve complete history in tests'
          git push origin HEAD:refs/heads/feat/client-journey-48h
