name: Client Journey Validation
on:
  push:
    branches: [feat/client-journey-48h]
  pull_request:
    branches: [pwa-edm28]
permissions:
  contents: read
concurrency:
  group: journey-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Archive tracked source only
        run: git archive --format=tar.gz --output="$RUNNER_TEMP/edm28-journey-source.tar.gz" HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: journey-source-${{ github.sha }}
          path: ${{ runner.temp }}/edm28-journey-source.tar.gz
          retention-days: 2
      - run: npm test
