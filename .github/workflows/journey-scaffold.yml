name: Journey Migration Scaffold
on:
  push:
    branches: [feat/client-journey-48h]
permissions:
  contents: read
jobs:
  scaffold:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: |
          npx --yes supabase@2.118.0 migration new --help
          npx --yes supabase@2.118.0 migration new client_journey_reservations
          git ls-files --others --exclude-standard supabase/migrations > migration-path.txt
          cat migration-path.txt
      - uses: actions/upload-artifact@v4
        with:
          name: journey-migration-path
          path: migration-path.txt
          retention-days: 2
