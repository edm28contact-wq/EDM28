name: Basket Validation
on:
  push:
    branches: [fix/supplier-basket-quote-flow]
permissions:
  contents: read
concurrency:
  group: basket-validation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Snapshot tracked source without local credentials
        run: git archive --format=tar.gz HEAD > "$RUNNER_TEMP/edm28-source.tar.gz"
      - uses: actions/upload-artifact@v4
        with:
          name: basket-reviewed-source-${{ github.sha }}
          path: ${{ runner.temp }}/edm28-source.tar.gz
          retention-days: 1
      - run: npm test
