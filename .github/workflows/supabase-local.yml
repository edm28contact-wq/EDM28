name: Supabase Local

on:
  pull_request:
    paths:
      - "supabase/**"
      - ".github/workflows/supabase-local.yml"
  push:
    branches:
      - feature/edm28-final-system
    paths:
      - "supabase/**"
      - ".github/workflows/supabase-local.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  migrations:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions