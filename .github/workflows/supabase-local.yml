name: Supabase Local

on:
  pull_request:
    paths:
      - "supabase/**"
      - ".github/workflows/supabase-local.yml"
  push:
    branches:
      - feature/edm28-final-system
    paths:
      - "supabase/**"
      - ".github/workflows/supabase-local.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  migrations:
    name: Supabase pass ${{ matrix.pass }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        pass: [1, 2, 3]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v2
        with:
          version: 2.109.1
          github-token: ${{ github.token }}

      - name: Initialize local Supabase configuration
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f supabase/config.toml ]; then
            supabase init
          fi

      - name: Prepare reproducible candidate migration chain
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/edm28-legacy-migrations
          mv supabase/migrations/*.sql /tmp/edm28-legacy-migrations/
          cp supabase/ci/baseline.sql supabase/migrations/20260711000000_ci_baseline.sql
          cp /tmp/edm28-legacy-migrations/20260719190000_admin_transactional_workflow.sql supabase/migrations/
          cp /tmp/edm28-legacy-migrations/20260719201000_consolidate_permissive_rls_policies.sql supabase/migrations/
          cp /tmp/edm28-legacy-migrations/20260719202000_add_missing_foreign_key_indexes.sql supabase/migrations/
          cp /tmp/edm28-legacy-migrations/20260724190000_client_messaging_loop.sql supabase/migrations/
          printf 'Candidate migration chain:\n'
          find supabase/migrations -maxdepth 1 -type f -name '*.sql' -printf '%f\n' | sort

      - name: Start fresh local Supabase stack
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p supabase-ci-artifacts
          supabase start 2>&1 | tee supabase-ci-artifacts/start.log

      - name: Rebuild the database from migrations
        shell: bash
        run: |
          set -euo pipefail
          supabase db reset --local --no-seed 2>&1 | tee supabase-ci-artifacts/reset.log

      - name: Show migration status
        if: always()
        shell: bash
        run: |
          supabase migration list --local 2>&1 | tee supabase-ci-artifacts/migrations.log || true

      - name: Upload Supabase logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: supabase-local-report-pass-${{ matrix.pass }}
          path: supabase-ci-artifacts
          if-no-files-found: warn

      - name: Stop local Supabase
        if: always()
        run: supabase stop --no-backup || true
