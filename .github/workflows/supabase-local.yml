name: Supabase Local

on:
  pull_request:
    paths:
      - "supabase/**"
      - ".github/workflows/supabase-local.yml"
  push:
    branches:
      - feature/edm28-final-system
    paths:
      - "supabase/**"
      - ".github/workflows/supabase-local.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  migrations:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v2
        with:
          version: 2.109.1
          github-token: ${{ github.token }}

      - name: Initialize local Supabase configuration
        shell: bash
        run: |
          if [ ! -f supabase/config.toml ]; then
            supabase init
          fi

      - name: Apply migrations to a fresh local database
        run: supabase db start

      - name: Rebuild the database from migrations
        run: supabase db reset --local --no-seed

      - name: Show migration status
        if: always()
        run: supabase migration list --local || true

      - name: Stop local Supabase
        if: always()
        run: supabase stop --no-backup || true
