name: Production Live Smoke

on:
  push:
    branches:
      - test/production-live-smoke-20260808
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  live-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install Playwright
        run: |
          set -euo pipefail
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Verify production HTTP and browser routes
        run: |
          set -euo pipefail
          mkdir -p live-smoke-artifacts
          cat > live-smoke.mjs <<'EOF'
          import { chromium } from 'playwright';
          import fs from 'node:fs/promises';

          const targets = [
            { name: 'www-home', url: 'https://www.edm28.fr/', titles: ['EDM AUTO', 'EDM · Spécialiste du freinage'], minBody: 500 },
            { name: 'apex-home', url: 'https://edm28.fr/', titles: ['EDM AUTO', 'EDM · Spécialiste du freinage'], minBody: 500 },
            { name: 'www-admin', url: 'https://www.edm28.fr/admin.html', titles: ['Gestion EDM28'], minBody: 100 }
          ];

          const browser = await chromium.launch();
          const report = [];
          let failed = false;

          for (const target of targets) {
            const page = await browser.newPage({ viewport: { width: 1440, height: 1000 } });
            const pageErrors = [];
            const requestFailures = [];
            const badResponses = [];
            const consoleErrors = [];
            page.on('pageerror', error => pageErrors.push(error.message));
            page.on('console', message => {
              if (message.type() === 'error' && !message.text().includes('PWA registration failed')) {
                const text = message.text();
                const source = message.location().url || '';
                const knownImageNoise = text.includes('ERR_INVALID_URL') && source.startsWith('data:image/');
                if (!knownImageNoise) consoleErrors.push({ text, source });
              }
            });
            page.on('requestfailed', request => {
              const url = request.url();
              const failure = request.failure()?.errorText || '';
              const knownImageNoise = url.startsWith('data:image/') && failure.includes('ERR_INVALID_URL');
              if (!knownImageNoise) requestFailures.push(`${url} ${failure}`);
            });
            page.on('response', response => {
              if (response.status() >= 400) badResponses.push(`${response.status()} ${response.url()}`);
            });

            let response;
            for (let attempt = 1; attempt <= 3; attempt += 1) {
              try {
                response = await page.goto(target.url, { waitUntil: 'domcontentloaded', timeout: 45000 });
                await page.waitForFunction((minBody) => document.body && document.body.innerText.length >= minBody, target.minBody, { timeout: 12000 });
                break;
              } catch (error) {
                if (attempt === 3) throw error;
                await page.waitForTimeout(1000);
              }
            }
            await page.waitForTimeout(1500);

            const row = {
              name: target.name,
              requestedUrl: target.url,
              finalUrl: page.url(),
              status: response?.status() || 0,
              title: await page.title(),
              visible: await page.locator('body').isVisible(),
              bodyLength: await page.locator('body').evaluate(node => node.innerText.length),
              pageErrors,
              requestFailures,
              badResponses,
              consoleErrors
            };
            report.push(row);

            const criticalBadResponses = badResponses.filter(item => !item.includes('/favicon.ico'));
            const titleOk = target.titles.includes(row.title);
            if (row.status < 200 || row.status >= 400 || !titleOk || !row.visible || row.bodyLength < target.minBody || pageErrors.length || requestFailures.length || criticalBadResponses.length) failed = true;

            await page.screenshot({ path: `live-smoke-artifacts/${target.name}.png`, fullPage: true });
            await page.close();
          }

          await browser.close();
          await fs.writeFile('live-smoke-artifacts/report.json', JSON.stringify(report, null, 2));
          console.log(JSON.stringify(report, null, 2));
          if (failed) process.exit(1);
          EOF
          node live-smoke.mjs | tee live-smoke-artifacts/run.log

      - name: Upload live smoke report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-live-smoke
          path: live-smoke-artifacts
