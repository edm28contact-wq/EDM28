name: Production Live Smoke

on:
  push:
    branches:
      - test/production-live-smoke-20260808
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  live-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install Playwright
        run: |
          set -euo pipefail
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Verify production desktop and Android layouts
        run: |
          set -euo pipefail
          mkdir -p live-smoke-artifacts
          cat > live-smoke.mjs <<'EOF'
          import { chromium, devices } from 'playwright';
          import fs from 'node:fs/promises';

          const targets = [
            { name: 'www-home-desktop', url: 'https://www.edm28.fr/', viewport: { width: 1440, height: 1000 } },
            { name: 'www-home-android-360', url: 'https://www.edm28.fr/', viewport: { width: 360, height: 800 }, mobile: true },
            { name: 'www-home-android-412', url: 'https://www.edm28.fr/', viewport: { width: 412, height: 915 }, mobile: true },
            { name: 'www-home-android-landscape', url: 'https://www.edm28.fr/', viewport: { width: 915, height: 412 }, mobile: true }
          ];

          const browser = await chromium.launch();
          const report = [];
          let failed = false;

          for (const target of targets) {
            const context = await browser.newContext({
              viewport: target.viewport,
              isMobile: Boolean(target.mobile),
              hasTouch: Boolean(target.mobile),
              deviceScaleFactor: target.mobile ? 2.75 : 1,
              userAgent: target.mobile ? devices['Pixel 7'].userAgent : undefined
            });
            const page = await context.newPage();
            const pageErrors = [];
            const requestFailures = [];
            const badResponses = [];
            const consoleErrors = [];
            page.on('pageerror', error => pageErrors.push(error.message));
            page.on('console', message => {
              if (message.type() === 'error' && !message.text().includes('PWA registration failed')) {
                const text = message.text();
                const source = message.location().url || '';
                const knownImageNoise = text.includes('ERR_INVALID_URL') && source.startsWith('data:image/');
                if (!knownImageNoise) consoleErrors.push({ text, source });
              }
            });
            page.on('requestfailed', request => {
              const url = request.url();
              const failure = request.failure()?.errorText || '';
              const knownImageNoise = url.startsWith('data:image/') && failure.includes('ERR_INVALID_URL');
              if (!knownImageNoise) requestFailures.push(`${url} ${failure}`);
            });
            page.on('response', response => {
              if (response.status() >= 400) badResponses.push(`${response.status()} ${response.url()}`);
            });

            const response = await page.goto(target.url, { waitUntil: 'domcontentloaded', timeout: 45000 });
            await page.waitForFunction(() => document.body && document.body.innerText.length >= 500, { timeout: 15000 });
            await page.waitForTimeout(2500);

            const layout = await page.evaluate(() => {
              const app = document.querySelector('.app-shell');
              const sidebar = document.querySelector('.sidebar');
              const main = document.querySelector('.main');
              const menu = document.querySelector('.mobile-menu');
              const ar = app?.getBoundingClientRect();
              const sr = sidebar?.getBoundingClientRect();
              const mr = main?.getBoundingClientRect();
              return {
                innerWidth: window.innerWidth,
                innerHeight: window.innerHeight,
                visualViewportWidth: window.visualViewport?.width || null,
                bodyClientWidth: document.body.clientWidth,
                bodyScrollWidth: document.body.scrollWidth,
                htmlClientWidth: document.documentElement.clientWidth,
                htmlScrollWidth: document.documentElement.scrollWidth,
                appRect: ar ? { x: ar.x, width: ar.width } : null,
                appGridColumns: app ? getComputedStyle(app).gridTemplateColumns : null,
                sidebarRect: sr ? { x: sr.x, right: sr.right, width: sr.width } : null,
                sidebarPosition: sidebar ? getComputedStyle(sidebar).position : null,
                sidebarTransform: sidebar ? getComputedStyle(sidebar).transform : null,
                sidebarDisplay: sidebar ? getComputedStyle(sidebar).display : null,
                mainRect: mr ? { x: mr.x, right: mr.right, width: mr.width } : null,
                mobileMenuDisplay: menu ? getComputedStyle(menu).display : null,
                max980: matchMedia('(max-width: 980px)').matches,
                max700: matchMedia('(max-width: 700px)').matches
              };
            });

            const row = {
              name: target.name,
              status: response?.status() || 0,
              title: await page.title(),
              pageErrors,
              requestFailures,
              badResponses,
              consoleErrors,
              layout
            };
            report.push(row);

            if (target.mobile) {
              const noHorizontalOverflow = layout.bodyScrollWidth <= layout.innerWidth + 1 && layout.htmlScrollWidth <= layout.innerWidth + 1;
              const oneColumn = layout.appGridColumns === `${layout.innerWidth}px` || layout.appGridColumns.split(' ').length === 1;
              const sidebarOffCanvas = layout.sidebarRect && layout.sidebarRect.right <= 0;
              const mainFits = layout.mainRect && layout.mainRect.x >= -1 && layout.mainRect.right <= layout.innerWidth + 1;
              if (!layout.max980 || !noHorizontalOverflow || !oneColumn || !sidebarOffCanvas || !mainFits) failed = true;
            }
            if (row.status < 200 || row.status >= 400 || pageErrors.length || requestFailures.length || badResponses.length) failed = true;

            await page.screenshot({ path: `live-smoke-artifacts/${target.name}.png`, fullPage: true });
            await context.close();
          }

          await browser.close();
          await fs.writeFile('live-smoke-artifacts/report.json', JSON.stringify(report, null, 2));
          console.log(JSON.stringify(report, null, 2));
          if (failed) process.exit(1);
          EOF
          node live-smoke.mjs | tee live-smoke-artifacts/run.log

      - name: Upload live smoke report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-live-smoke
          path: live-smoke-artifacts
