name: Journey Final Source
on:
  push:
    branches: [feat/client-journey-48h]
    paths: [.github/workflows/journey-final-source.yml]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Export source and migration path without secrets
        run: |
          git archive HEAD -o reviewed-source.tar
          npx --yes supabase@2.81.3 migration new --help
          npx --yes supabase@2.81.3 migration new journey_schema_reconciliation
          git ls-files --others --exclude-standard supabase/migrations > migration-path.txt
          git rev-parse HEAD > source-sha.txt
      - uses: actions/upload-artifact@v4
        with:
          name: journey-final-source
          path: |
            reviewed-source.tar
            migration-path.txt
            source-sha.txt
          retention-days: 2
