name: Full Validation

on:
  pull_request:
    branches: [pwa-edm28]
  push:
    branches: [pwa-edm28]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Run full test suite
        run: npm test
