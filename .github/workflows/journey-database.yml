name: Client Journey Database
on:
  push:
    branches: [feat/client-journey-48h, pwa-edm28]
  pull_request:
    branches: [pwa-edm28]
permissions:
  contents: read
jobs:
  database:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: isolated-test-only
          POSTGRES_DB: journey_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: isolated-test-only
      PGDATABASE: journey_test
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Exercise ownership, reservations, proofs, publication and email capabilities
        run: |
          psql -v ON_ERROR_STOP=1 -f tests/supplier-basket-fixture.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20260929153243_supplier_basket_quote_flow.sql
          psql -v ON_ERROR_STOP=1 -f tests/journey-fixture.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20260929210843_client_journey_reservations.sql
          psql -v ON_ERROR_STOP=1 -1 -f supabase/migrations/20260929222543_journey_schema_reconciliation.sql
          psql -v ON_ERROR_STOP=1 -1 -f supabase/migrations/20261007220000_reservation_parts_mismatch_policy.sql
          psql -v ON_ERROR_STOP=1 -f tests/journey-db.sql
