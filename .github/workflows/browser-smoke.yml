name: Browser Smoke

on:
  pull_request:
  push:
    branches:
      - feature/edm28-final-system
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser:
    name: Browser pass ${{ matrix.pass }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        pass: [1, 2, 3]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium firefox webkit

      - name: Start static server
        run: |
          python3 -m http.server 4173 > /tmp/edm28-http.log 2>&1 &
          echo $! > /tmp/edm28-http.pid
          for attempt in {1..30}; do
            curl -fsS http://127.0.0.1:4173/ >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/edm28-http.log
          exit 1

      - name: Run responsive public and admin smoke tests
        run: |
          mkdir -p browser-artifacts
          cat > browser-smoke.mjs <<'EOF'
          import { chromium } from 'playwright';
          import fs from 'node:fs/promises';

          const browser = await chromium.launch();
          const widths = [320, 360, 390, 412, 768, 1024, 1440, 1920];
          const cases = [];
          for (const width of widths) {
            const height = width <= 412 ? 844 : width <= 768 ? 1000 : 1080;
            cases.push({ name: `public-${width}`, path: '/', viewport: { width, height }, title: 'EDM AUTO' });
            cases.push({ name: `admin-${width}`, path: '/admin.html', viewport: { width, height }, title: 'Gestion EDM28' });
          }

          const report = [];
          let failed = false;

          for (const test of cases) {
            const page = await browser.newPage({ viewport: test.viewport, hasTouch: test.viewport.width <= 412 });
            const errors = [];
            const failedRequests = [];
            page.on('pageerror', error => errors.push(`pageerror: ${error.message}`));
            page.on('console', message => {
              if (message.type() === 'error' && !message.text().includes('PWA registration failed')) errors.push(`console: ${message.text()}`);
            });
            page.on('requestfailed', request => failedRequests.push(`${request.url()} ${request.failure()?.errorText || ''}`));

            const response = await page.goto(`http://127.0.0.1:4173${test.path}`, {
              waitUntil: 'domcontentloaded',
              timeout: 30000
            });
            await page.waitForTimeout(1500);

            const title = await page.title();
            const bodyVisible = await page.locator('body').isVisible();
            const horizontalOverflow = await page.evaluate(() => document.documentElement.scrollWidth > document.documentElement.clientWidth + 2);
            const status = response?.status() ?? 0;

            await page.screenshot({
              path: `browser-artifacts/${test.name}.png`,
              fullPage: true
            });

            const checks = { status, title, expectedTitle: test.title, bodyVisible, horizontalOverflow, errors, failedRequests };
            report.push({ name: test.name, ...checks });

            if (status !== 200 || title !== test.title || !bodyVisible || horizontalOverflow || errors.length > 0 || failedRequests.length > 0) failed = true;
            await page.close();
          }

          await browser.close();
          await fs.writeFile('browser-artifacts/report.json', JSON.stringify(report, null, 2));
          console.log(JSON.stringify(report, null, 2));
          if (failed) process.exit(1);
          EOF
          node browser-smoke.mjs 2>&1 | tee browser-artifacts/run.log

      - name: Run complete client journey
        run: node tests/browser-client-journey.mjs 2>&1 | tee browser-artifacts/client-journey.log

      - name: Run connected account stress matrix
        run: |
          set -e
          for browser in chromium firefox webkit; do
            EDM_BROWSER="$browser" EDM_TEST_PORT=4190 node tests/account-navigation-stress.mjs 2>&1 | tee "browser-artifacts/account-${browser}-desktop.log"
          done
          EDM_BROWSER=chromium EDM_MOBILE=1 EDM_TEST_PORT=4191 node tests/account-navigation-stress.mjs 2>&1 | tee browser-artifacts/account-chromium-mobile.log

      - name: Upload browser report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-smoke-report-pass-${{ matrix.pass }}
          path: browser-artifacts
          if-no-files-found: warn
